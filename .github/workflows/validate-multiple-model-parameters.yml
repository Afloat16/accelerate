name: Validate multi-model parameter mapping
on:
  push:
    branches: [validation/multiple-model-parameter-mapping-20261113]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime: [cpu, xla-cpu]
    env:
      PJRT_DEVICE: CPU
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 04023a70f672c058cf0f3a9128550e38b80780a9
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native environment
        run: |
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test_prod,quality]"
          if [ "${{ matrix.runtime }}" = "xla-cpu" ]; then
            python -m pip install torch_xla==2.9.0
          fi
          python -m pip freeze > installed-dependencies.txt
      - name: Test exact production commit
        run: |
          git rev-parse HEAD
          python -m pytest -q tests/test_multiple_model_parameters.py --junitxml=after.xml > after.log 2>&1
          cat after.log
          python -m pytest -q tests/test_optimizer.py --junitxml=existing.xml > existing.log 2>&1
          cat existing.log
      - name: Compare unchanged regression tests against upstream
        run: |
          git show 3bd795f7cfb763b994b4ba8ba59e5a305a7c528a:src/accelerate/accelerator.py > src/accelerate/accelerator.py
          set +e
          python -m pytest -q tests/test_multiple_model_parameters.py --junitxml=before.xml > before.log 2>&1
          result=$?
          set -e
          cat before.log
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for name in ("before", "after", "existing"):
              root = ET.parse(name + ".xml").getroot()
              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              print(name, {key: sum(int(s.get(key, 0)) for s in suites)
                           for key in ("tests", "failures", "errors", "skipped")})
              if any(int(s.get("errors", 0)) for s in suites):
                  raise SystemExit("Unexpected collection/runtime error")
          PY
      - name: Project-pinned style and patch checks
        run: |
          git restore src/accelerate/accelerator.py
          ruff check src/accelerate/accelerator.py tests/test_multiple_model_parameters.py
          ruff format --check src/accelerate/accelerator.py tests/test_multiple_model_parameters.py
          git diff --check HEAD^ HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-model-${{ matrix.runtime }}-evidence
          path: |
            after.log
            after.xml
            before.log
            before.xml
            existing.log
            existing.xml
            installed-dependencies.txt
