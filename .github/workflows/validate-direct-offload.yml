name: Validate direct tensor disk offload
on:
  push:
    branches: [validation/split-module-direct-offload-20261113]
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install official CPU dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python -e '.[test_prod,quality]' torchdata transformers
      - name: Compare native disk dispatch and trained checkpoint inference
        run: .venv/bin/python validation/run_direct_offload.py
      - name: Check changed source and tests
        run: |
          .venv/bin/ruff check src/accelerate/hooks.py src/accelerate/utils/modeling.py tests/test_direct_tensor_dispatch.py
          .venv/bin/ruff format --check src/accelerate/hooks.py src/accelerate/utils/modeling.py tests/test_direct_tensor_dispatch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-offload-native-evidence
          path: |
            before.log
            before.xml
            after.log
            after.xml
            existing.log
            existing.xml
            native-report.json
