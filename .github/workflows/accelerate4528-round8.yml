name: Accelerate 4528 exact-source validation
on:
  push:
    branches: [validation/accelerate4528-round8-20261114]
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5efd4dce672fed6add98fe4c17d027210c7affe1
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native CPU dependencies
        run: |
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test_prod,quality]'
          python -c 'import sys, torch; print(sys.version); print(torch.__version__)'
      - name: Compare unchanged tests on baseline and exact candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess, sys, xml.etree.ElementTree as ET
          source = Path("src/accelerate/utils/modeling.py")
          test = Path("tests/test_cuda_device_comparison.py")
          original = source.read_bytes()
          test_hash = hashlib.sha256(test.read_bytes()).hexdigest()
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == "5efd4dce672fed6add98fe4c17d027210c7affe1"
          rows = []
          try:
              for phase, content, expected_failed in [
                  ("baseline", subprocess.check_output(["git", "show", "f47439c1fb24721ea71ab98f9b512726b5a97828:src/accelerate/utils/modeling.py"]), 1),
                  ("candidate", original, 0),
              ]:
                  source.write_bytes(content)
                  command = [sys.executable, "-m", "pytest", "-q", str(test), "--junitxml=" + phase + ".xml"]
                  result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  print(result.stdout, flush=True)
                  Path(phase + ".log").write_text(result.stdout)
                  cases = list(ET.parse(phase + ".xml").getroot().iter("testcase"))
                  failures = [c for c in cases if c.find("failure") is not None]
                  assert len(cases) == 2 and len(failures) == expected_failed
                  assert all(c.find("error") is None and c.find("skipped") is None for c in cases)
                  assert result.returncode == (1 if expected_failed else 0)
                  rows.append({"phase": phase, "command": command, "passed": 2 - expected_failed, "failed": expected_failed, "skipped": 0})
          finally:
              source.write_bytes(original)
              assert hashlib.sha256(test.read_bytes()).hexdigest() == test_hash
              subprocess.run(["git", "diff", "--exit-code"], check=True)
              Path("validation-results.json").write_text(json.dumps(rows, indent=2))
              print(json.dumps(rows, indent=2), flush=True)
          PY
      - name: Verify repository quality
        run: |
          make quality
          git diff --check HEAD^ HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accelerate4528-exact
          path: |
            baseline.log
            baseline.xml
            candidate.log
            candidate.xml
            validation-results.json
