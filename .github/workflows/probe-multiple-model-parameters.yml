name: Probe native XLA multi-model parameter transfer
on:
  push:
    branches: [validation/probe-multiple-model-parameters-20261113]
permissions:
  contents: read
jobs:
  native-xla-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PJRT_DEVICE: CPU
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native XLA CPU environment
        run: |
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch_xla==2.9.0 -e .
          python -m pip freeze > installed-dependencies.txt
      - name: Run actual Accelerator and XLA training
        run: |
          set +e
          python contribution-probes/multiple_models_xla.py > native-xla.log 2>&1
          result=$?
          set -e
          cat native-xla.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-xla-multimodel-probe
          path: |
            native-xla.log
            installed-dependencies.txt
