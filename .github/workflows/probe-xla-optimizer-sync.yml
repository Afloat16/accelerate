name: Probe multiple XLA optimizer gradient synchronization
on:
  push:
    branches: [validation/xla-multiple-optimizer-probe-20261113]
permissions:
  contents: read
jobs:
  native-xla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PJRT_DEVICE: CPU
      CPU_NUM_DEVICES: "2"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official native CPU XLA
        run: |
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test_prod,quality]" torch_xla==2.9.0
      - name: Probe upstream multiple optimizer gradients
        run: timeout 180 python contribution-validation/probe_xla_optimizer_sync.py
